name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

# A push to a branch with an open PR triggers both events; keep only the newest run per branch.
concurrency:
  # Keyed by event too: a push run must not cancel the pull-request run of the same branch, or vice versa.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
